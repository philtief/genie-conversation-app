command:
  - "streamlit"
  - "run"
  - "app.py"
  - "--server.port"
  - "8000"
  - "--server.address"
  - "0.0.0.0"
  - "--server.headless"
  - "true"

# Optional. If unset, the app shows a sidebar dropdown listing every Genie
# space the app's service principal can access. Set to pin to one space.
# env:
#   - name: GENIE_SPACE_ID
#     value: "<your-genie-space-id>"
#   - name: DATABRICKS_WAREHOUSE_ID
#     value: "<your-warehouse-id>"
